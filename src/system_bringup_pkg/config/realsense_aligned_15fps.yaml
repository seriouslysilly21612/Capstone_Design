# A/B 실험용 카메라 설정 (2026-07-30, 교수님 지적 확인)
#   "RGB·depth 모두 15fps + 단일점 reverse projection 끄고 SDK align_depth 켬"
#
# realsense_pick_place.yaml(프로덕션)의 복사본이며 **딱 두 줄만** 다르다.
# 나머지는 글자 그대로 동일하게 유지했다 — 변수 하나만 바꿔야 비교가 성립한다.
#   1) align_depth.enable          false -> true
#   2) rgb_camera.color_profile    848x480x30 -> 848x480x15
#
# align_depth.enable: true 로 두면 카메라 노드가 매 프레임 full-frame
# depth->color 정합을 CPU에서 수행하고 /camera/camera/aligned_depth_to_color/*
# 를 발행한다. 2026-07-14에 이걸 끄고 단일점 reverse projection 으로 옮긴
# 이력이 있다(당시: A53 한 코어 점유 + 처리율 반토막). 이번 실험은 그 대가를
# "양쪽 15fps" 조건에서 정량으로 다시 재는 것이다.
#
# 짝으로 쓰는 설정: target_3d_aligned.yaml (use_aligned_depth: true)
# 프로덕션 yaml 은 건드리지 않았다 — 이 파일을 안 쓰면 원래대로 돌아간다.

# Hardware-reset the camera at node startup. 2026-07-14: the RGB sensor wedged
# at the UVC level (repeated "Failed to query (GET_CUR) UVC control 1 ... -32"
# in dmesg) ~3 s into a run — color frames stopped while depth kept streaming.
# A reset at startup clears stale UVC state left by a previous wedge/hard reboot.
initial_reset: true
enable_color: true
enable_depth: true
enable_sync: false
# [실험 변수 1/2] 프로덕션은 false
align_depth.enable: true
enable_rgbd: false
pointcloud.enable: false
colorizer.enable: false
enable_infra: false
enable_infra1: false
enable_infra2: false
enable_gyro: false
enable_accel: false
depth_module.depth_profile: 848x480x15
# [실험 변수 2/2] 프로덕션은 848x480x30
rgb_camera.color_profile: 848x480x15
