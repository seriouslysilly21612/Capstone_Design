# RealSense config for DESKTOP VIEWING only (viewing.launch.py).
# Production is realsense_pick_place.yaml — do not edit that one for viewing.
#
# Identical to production except color is 30 -> 15 fps. See the block above
# rgb_camera.color_profile for why that is free.
initial_reset: true
enable_color: true
enable_depth: true
enable_sync: false
align_depth.enable: false
enable_rgbd: false
pointcloud.enable: false
colorizer.enable: false
enable_infra: false
enable_infra1: false
enable_infra2: false
enable_gyro: false
enable_accel: false
depth_module.depth_profile: 848x480x15
# Color 30 -> 15 fps FOR VIEWING, and it costs no detections.
#
# process_period_sec (vitis_ai_detector.yaml) is a MINIMUM-INTERVAL gate of
# 45 ms, not a divider:
#   30 fps -> frames 33.3 ms apart -> every 2nd passes (33.3 < 45) -> 15 Hz
#   15 fps -> frames 66.6 ms apart -> every frame passes (66.6 >= 45) -> 15 Hz
# So the detection rate is 15 Hz either way, and at 30 fps we would JPEG-encode
# twice as many frames as the viewer can use: the viewer renders on detection
# arrival, so exactly half the encodes would be thrown away.
#
# Trade-off: color staleness 33 -> 66 ms. Irrelevant for looking at boxes.
# To compare CPU like-for-like against production numbers, launch with
#   ros2 launch system_bringup_pkg viewing.launch.py \
#     camera_config:=$(ros2 pkg prefix system_bringup_pkg)/share/system_bringup_pkg/config/realsense_pick_place.yaml
rgb_camera.color_profile: 848x480x15
